spring:
  application:
    name: ClinicIT

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/clinicit}
    username: ${DB_USERNAME:clinicit}
    password: ${DB_PASSWORD:clinicit}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
