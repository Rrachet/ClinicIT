spring:
  application:
    name: ClinicIT

  # Local-development defaults only. The prod profile (application-prod.yml) has no defaults
  # and refuses these credentials (ProductionConfigurationCheck).
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/clinicit}
    username: ${DB_USERNAME:clinicit}
    password: ${DB_PASSWORD:clinicit}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      # Fail a request after 5 s without a free connection instead of hanging for 30 s.
      connection-timeout: 5000
      data-source-properties:
        # PostgreSQL error DETAIL lines can contain row contents (e.g. "Failing row contains
        # (…name, phone…)"). Keep them out of exception messages, and so out of the logs.
        logServerErrorDetail: false

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

server:
  port: ${PORT:8080}

clinicit:
  auth:
    # Absolute lifetime of a login token (ISO-8601 duration); covers one clinic shift.
    session-ttl: ${CLINICIT_SESSION_TTL:PT12H}
    # Brute-force protection: attempts per account / failures per client IP per window.
    login-window: PT15M
    max-attempts-per-account: 5
    max-failures-per-ip: 30
    # Purge of expired/revoked sessions and stale throttle rows.
    cleanup-interval: PT1H
  notifications:
    enabled: ${CLINICIT_NOTIFICATIONS_ENABLED:true}
    # "development" records messages instead of sending them. A real SMS/WhatsApp/email
    # provider is a NotificationProvider bean selected by this name (docs/NOTIFICATIONS.md).
    provider: ${CLINICIT_NOTIFICATIONS_PROVIDER:development}
    channel: ${CLINICIT_NOTIFICATIONS_CHANNEL:SMS}
    # Public URL of the frontend; patients get {base}/status/{code}.
    status-link-base-url: ${CLINICIT_PUBLIC_APP_URL:http://localhost:3000}
    near-turn-threshold: 1
    max-attempts: 5
    retry-base-delay: PT30S
    retry-max-delay: PT30M
    poll-interval: PT10S
    retention: P30D
  prediction:
    # Python wait-time model service (ml/). Empty: estimates come from the deterministic baseline.
    ml-base-url: ${CLINICIT_ML_BASE_URL:}
    timeout: ${CLINICIT_ML_TIMEOUT:PT0.8S}
    failure-backoff: PT30S
    cache-ttl: PT60S
  # Demo clinic for evaluation (docs/DEMO.md): loaded on an empty database only; the prod
  # profile refuses to start with it enabled. The password has no default.
  demo:
    enabled: ${CLINICIT_DEMO_ENABLED:false}
    password: ${CLINICIT_DEMO_PASSWORD:}
  public-status:
    # Per client IP, per window, on the anonymous patient status page. Requests are generous
    # (a waiting room shares one address); unknown codes are few (guessing).
    window: PT1M
    max-requests-per-ip: 300
    max-misses-per-ip: 20
  cors:
    # Comma-separated exact origins of the web frontend, e.g. https://app.example.com
    allowed-origins: ${CLINICIT_CORS_ALLOWED_ORIGINS:}
  # First clinic + admin on an empty database. Set through environment variables only,
  # never committed: CLINICIT_BOOTSTRAP_ADMIN_EMAIL, CLINICIT_BOOTSTRAP_ADMIN_PASSWORD,
  # CLINICIT_BOOTSTRAP_CLINIC_NAME (optional: CLINICIT_BOOTSTRAP_ADMIN_NAME,
  # CLINICIT_BOOTSTRAP_CLINIC_TIMEZONE).

logging:
  pattern:
    # Request id (RequestIdFilter) on every log line of a request.
    correlation: "[%X{requestId:-}] "

# Actuator: health probes and Prometheus metrics on a separate, internal port. It must not be
# exposed publicly (docs/OPERATIONS.md). The public API keeps GET /api/v1/health.
management:
  server:
    port: ${MANAGEMENT_PORT:8081}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
      group:
        # Liveness: is the process able to run at all? Never depends on PostgreSQL or the ML
        # service, so an outage of either does not get the app restarted in a loop.
        liveness:
          include: livenessState,ping
        # Readiness: can it serve traffic now? Needs the database; the ML service is optional
        # (estimates fall back to the baseline), so it is deliberately not included.
        readiness:
          include: readinessState,db
  metrics:
    tags:
      application: ClinicIT
    distribution:
      percentiles-histogram:
        http.server.requests: true
        clinicit.queue.wait: true
        clinicit.consultation.duration: true
        clinicit.ml.requests: true
